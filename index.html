<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Reclaim disk from build artifacts. Uncached scans a workspace for dependency, build, and cache directories your toolchains can regenerate, then moves them to the Recycle Bin." />
    <link rel="canonical" href="https://uncached.app" />
    <meta property="og:title" content="Uncached" />
    <meta property="og:description" content="Reclaim disk from build artifacts. Uncached scans a workspace for dependency, build, and cache directories your toolchains can regenerate, then moves them to the Recycle Bin." />
    <meta property="og:url" content="https://uncached.app" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/brand/UNCACHED-ICON-NIGHT.svg" />
    <script>
      (function() {
        try {
          var appearance = localStorage.getItem("uncached_appearance") || "system";
          var isDark = appearance === "dark" || (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>Uncached</title>
    <style>
      #app-splashscreen {
        position: fixed;
        /* The window is undecorated and transparent, so its corners and its
           inset are drawn in CSS. This element paints before the bundle's
           stylesheet exists, which is the whole point of a splash — so it has
           to repeat both, or the first thing the user sees is a square that
           overhangs the window it is covering. Keep in step with
           `--window-gutter` and `--window-radius` in `src/index.css`. */
        inset: 16px;
        z-index: 99999;
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f6f4ea;
        transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        -webkit-user-select: none;
      }

      [data-theme="dark"] #app-splashscreen {
        background: #14140f;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #app-splashscreen {
          background: #14140f;
        }
      }

      #app-splashscreen.splash-fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .app-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      .splash-logo {
        height: 44px;
        width: auto;
        object-fit: contain;
      }

      .splash-logo-dark {
        display: none;
      }

      .splash-logo-light {
        display: block;
      }

      [data-theme="dark"] .splash-logo-light {
        display: none;
      }

      [data-theme="dark"] .splash-logo-dark {
        display: block;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .splash-logo-light {
          display: none;
        }
        :root:not([data-theme="light"]) .splash-logo-dark {
          display: block;
        }
      }

      .splash-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid #dfe7dc;
        border-top-color: #567a3d;
        border-radius: 50%;
        animation: splashSpin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      }

      [data-theme="dark"] .splash-spinner {
        border-color: #222b24;
        border-top-color: #b9d98d;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .splash-spinner {
          border-color: #222b24;
          border-top-color: #b9d98d;
        }
      }

      @keyframes splashSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="app-splashscreen">
      <div class="app-splash-content">
        <img src="/brand/UNCACHED-LOGO-DARK-NOBG.svg" alt="Uncached" class="splash-logo splash-logo-light" />
        <img src="/brand/UNCACHED-LOGO-LIGHT-NOBG.svg" alt="Uncached" class="splash-logo splash-logo-dark" />
        <div class="splash-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
