[package]
name = "uncached"
version = "0.1.1-alpha.2"
description = "Reclaim disk from build artifacts."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uncached_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
chrono = { version = "0.4", features = ["serde"] }
trash = "5.2"
thiserror = "2.0"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
# Pinned as the full forty characters, which is what CI's drift check reads.
# An abbreviated revision makes its regex match nothing, and the step that
# reports drift fails the build instead of reporting it.
#
# `.cargo/config.toml` patches this to the sibling checkout, so this pin does not
# decide what gets compiled — CI builds whatever `uncached-core` main is at. It
# decides what a build without that sibling would resolve, and it is what the
# drift warning compares against before a release.
uncached-core = { git = "ssh://git@github.com/uncached-app/uncached-core.git", rev = "5df0fbaaa3432056856db05f0d8e969e21d4d7a0", package = "uncached-core" }
