# One platform, and the cheapest one, because the alternative turned out to be
# more expensive than it looked.
#
# CI used to build all three on every push. macOS is billed at ten times the
# minutes and was seventy per cent of the cost while being the fastest job, so
# it was removed entirely — and the next two releases died on code that had
# never been compiled off macOS, at roughly eleven times what this job costs
# each time.
#
# So: Linux only. It catches the class that keeps costing releases — code that
# compiles on a Mac and nowhere else — for about eight cents a push, against
# eighty-seven for a release that fails on it. macOS is covered by the machine
# this is written on. Windows is not, and that is a known gap: the release is
# still the first thing to compile it.
name: CI

# Nothing runs on a push. Only when asked, and before a tag is when to ask.
#
# This job costs about eight cents and has already paid for itself once: it
# caught a call to a macOS-only API that had killed a release costing eighty-
# seven. Left automatic it also ran alongside every release, checking Linux
# while the release was already building it.
#
#   gh workflow run ci.yml
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CORE_REPOSITORY: uncached-app/uncached-core
  CORE_REF: main

defaults:
  run:
    working-directory: uncached-desktop

jobs:
  linux:
    name: Compiles off macOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: uncached-desktop

      - name: Reject fork pull request without private-core access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        shell: bash
        run: |
          echo "Fork pull requests cannot receive UNCACHED_CORE_DEPLOY_KEY." >&2
          exit 1

      - name: Checkout core as a sibling repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          ssh-key: ${{ secrets.UNCACHED_CORE_DEPLOY_KEY }}
          path: uncached-core

      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: uncached-desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        # tauri.conf.json points frontendDist at ../dist, so the Rust build
        # below needs this to have run first.
        run: pnpm build

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The repository root is the Cargo workspace, not src-tauri. Pointed
          # anywhere else this caches nothing.
          workspaces: uncached-desktop

      - name: Check formatting
        run: cd src-tauri && cargo fmt --check

      - name: Clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test
