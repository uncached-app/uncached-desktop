# Builds every platform, signs the update artifacts, and publishes them.
#
# The manifest is written last, on purpose. `latest.json` is what tells running
# copies of Uncached that a new version exists, so it must not name a file that
# is still uploading — a client that reads it a second too early downloads a
# truncated bundle and fails its signature check, which is the one failure mode
# that looks like the update system being broken rather than slow.
#
# Two signings, and they are not the same thing:
#
#   TAURI_SIGNING_PRIVATE_KEY  proves an update came from us. Compiled into
#                              every shipped binary as its public half, so it
#                              can never be rotated for copies already out
#                              there. Losing it ends the update path.
#   Apple / Windows signing    proves the app is not malware, to the operating
#                              system. Absent here until the certificates
#                              exist; its absence does not stop updates, it
#                              stops them being installed without a warning.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and upload the bundles, but do not announce the version"
        type: boolean
        default: true
      publish_only:
        description: "Publish what is already on the CDN for this version, instead of building again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CORE_REPOSITORY: uncached-app/uncached-core
  CORE_REF: main

defaults:
  run:
    working-directory: uncached-desktop

jobs:
  build:
    name: ${{ matrix.target }}
    # Skipped when a republish names the run to take bundles from. Compiling
    # four platforms of Rust is the expensive half of a release, and a release
    # that failed after the build — on a version string, a notes file, a
    # credential — does not need any of it done twice.
    if: github.event_name == 'push' || !inputs.publish_only
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two separate macOS builds rather than a universal binary: the
          # updater manifest keys on architecture, and an Intel machine
          # downloading an Apple Silicon bundle is a failure with no message
          # worth reading.
          - os: macos-latest
            target: aarch64-apple-darwin
            rust: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc

    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: uncached-desktop

      - name: Require private core deploy key
        shell: bash
        env:
          UNCACHED_CORE_DEPLOY_KEY: ${{ secrets.UNCACHED_CORE_DEPLOY_KEY }}
        run: |
          if [ -z "$UNCACHED_CORE_DEPLOY_KEY" ]; then
            echo "Missing Actions secret UNCACHED_CORE_DEPLOY_KEY." >&2
            exit 1
          fi

      - name: Checkout core as a sibling repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          ssh-key: ${{ secrets.UNCACHED_CORE_DEPLOY_KEY }}
          path: uncached-core
          fetch-depth: 0

      # A build without this compiles, runs, and can verify no licence at all:
      # every activation fails, silently, in the hands of somebody who has just
      # paid. So it is checked before anything is compiled — but checked for
      # being *present*, not for coming from a secret.
      #
      # It normally comes from `[env]` in src-tauri/.cargo/config.toml, where it
      # is committed on purpose: a public key verifies signatures and unlocks
      # nothing, and keeping it there is what makes every build — a laptop's, a
      # release runner's — accept the same licences. The secret exists only to
      # override it, and demanding one would fail every release over a value
      # that is already correct.
      # Three files carry the version and all three must agree. The manifest is
      # built from tauri.conf.json, the binary reports it, and Cargo stamps it —
      # so a drift means the update badge offering a version the About screen
      # says is already installed, which is unfalsifiable from the outside and
      # looks like the updater being broken.
      - name: Require one version, in three places
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$crate"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "These must be the same version." >&2
            exit 1
          fi

      - name: Require a licence public key
        shell: bash
        env:
          OVERRIDE: ${{ secrets.UNCACHED_LICENSE_PUBLIC_KEY }}
        run: |
          committed=$(sed -n 's/^UNCACHED_LICENSE_PUBLIC_KEY *= *"\(.*\)"/\1/p' src-tauri/.cargo/config.toml)
          if [ -z "$OVERRIDE" ] && [ -z "$committed" ]; then
            echo "No licence public key: none in src-tauri/.cargo/config.toml and no UNCACHED_LICENSE_PUBLIC_KEY secret." >&2
            echo "A build without one unlocks nothing, for anybody, and says so nowhere." >&2
            exit 1
          fi
          echo "Licence key source: ${OVERRIDE:+secret override}${OVERRIDE:-src-tauri/.cargo/config.toml}"

      - name: Install Linux Tauri dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: uncached-desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      # The repo root is the Cargo workspace (`members = ["src-tauri"]`), so
      # `target/` is there and not under src-tauri. Pointed at the wrong place
      # this caches nothing and every build is a cold one, which on a macOS
      # runner is billed at ten times the minutes.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: uncached-desktop

      # Forwarded only when they exist, and that is the whole point of the
      # step. A secret that is not set does not disappear from a workflow — it
      # arrives as an empty string, and the bundler tests for the variable
      # being *present*, not for it having a value. Passing them
      # unconditionally made the macOS build try to import an empty certificate
      # and fail: "no code signing" became "broken code signing", which is
      # strictly worse than never mentioning Apple at all.
      - name: Forward Apple signing, if there is any
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            # Ad-hoc rather than nothing. An unsigned bundle on Apple Silicon is
            # not merely untrusted — Gatekeeper reports it as *damaged*, and the
            # only way past that is a terminal command, which is not something
            # to ask of somebody who has just downloaded an app. An ad-hoc
            # signature is still untrusted and still needs right-click → Open,
            # but it says "unidentified developer", which is true and which the
            # dialog itself offers a way through.
            #
            # It cannot be notarised, so this is the floor until the
            # certificates exist, not a substitute for them.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::No Apple certificate. Signing ad-hoc: installs behind an unidentified-developer warning, not a damaged-app error."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value=$(printenv "$name" || true)
            [ -n "$value" ] || continue
            {
              echo "$name<<UNCACHED_EOF"
              echo "$value"
              echo "UNCACHED_EOF"
            } >> "$GITHUB_ENV"
          done
          echo "::notice::Apple signing is configured; the bundle will be signed and notarised."

      - name: Build and sign
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          UNCACHED_LICENSE_PUBLIC_KEY: ${{ secrets.UNCACHED_LICENSE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: uncached-desktop
          args: --target ${{ matrix.rust }}
          includeUpdaterJson: false

      # Taken from the bundler rather than guessed at. The first attempt walked
      # a path this workflow had reasoned out — and reasoned wrong, because the
      # Cargo workspace root is the repository and `target/` is not under
      # src-tauri. `artifactPaths` is the bundler saying what it produced,
      # which cannot drift from what it produced.
      - name: Collect what will be published
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/release/${{ matrix.target }}"
          mkdir -p "$destination"

          if [ -z "${ARTIFACTS:-}" ]; then
            echo "tauri-action reported no artifacts at all." >&2
            exit 1
          fi

          # `Uncached.app` is among them and is a directory: the thing that
          # updates is its tarball, and the thing a visitor downloads is the
          # dmg. Only files are carried.
          # `cygpath` rather than a substitution of my own. The bundler reports
          # `D:\a\x` on Windows and this runs under Git Bash, which wants
          # `/d/a/x`; converting it by hand is guessing at a translation the
          # platform ships a tool for, and a guess that is subtly wrong here
          # skips every artifact and reports that nothing was built.
          #
          # Each skip says why. A previous attempt failed with an empty
          # directory and no explanation, which left the cause to be inferred
          # from a log that had not been asked to record it.
          printf '%s' "$ARTIFACTS" | jq -r '.[]' | while IFS= read -r reported; do
            path=$(printf '%s' "$reported" | tr -d '\r')
            if command -v cygpath >/dev/null 2>&1; then
              path=$(cygpath -u "$path")
            fi
            if [ ! -e "$path" ]; then
              echo "::warning::not on disk, skipped: $reported -> $path"
              continue
            fi
            # A macOS build reports `Uncached.app`, which is a directory. What
            # updates is its tarball; the directory is the thing the tarball is
            # made of.
            if [ -d "$path" ]; then
              continue
            fi
            cp "$path" "$destination/"
          done

          ls -la "$destination"

          # An updater bundle with no detached signature is a bundle no client
          # will install. It is not an error the bundler raises — the build
          # succeeds and the `.sig` simply is not there — so it is caught here,
          # rather than by every user at once after a release.
          if ! ls "$destination"/*.sig >/dev/null 2>&1; then
            echo "No .sig beside any bundle: the updater signing key did not reach this build." >&2
            exit 1
          fi

      # Straight to where the CDN serves it: nothing reads `releases/<version>/`
      # until `latest.json` names that version, and the manifest goes up last.
      # A version that is already live is refused. Its manifest carries the
      # signatures of the bundles there and the edge caches them as immutable,
      # so replacing them breaks every update to it.
      - name: Upload to the CDN
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          SOURCE: ${{ github.workspace }}/release/${{ matrix.target }}
          TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          live=$(curl -fsS https://cdn.uncached.app/latest.json \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$live" = "$version" ]; then
            echo "$version is already live; its bundles are not replaced." >&2
            exit 1
          fi
          # `--delete` so the prefix holds exactly this build: a leftover from an
          # earlier attempt would give the manifest two bundles to choose from.
          aws s3 sync "$SOURCE" "s3://$BUCKET/releases/$version/$TRIPLE/" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete \
            --only-show-errors

  # Runs on a dry run too, and stops before announcing anything.
  #
  # The manifest builder is the part of a release with the most ways to be
  # quietly wrong — it decides which of several signed bundles is the one that
  # updates, and gets it right per platform. Skipping this job on dry runs meant
  # that logic was first exercised by the real release, on the one path where
  # being wrong is expensive. It found a genuine fault the moment it was run:
  # Linux signs its `.deb` and `.rpm` as well as its `.AppImage`.
  publish:
    name: Publish to the CDN
    needs: build
    # `always()` so a skipped build does not take publish with it, and the
    # explicit result check so a *failed* build still does.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: uncached-desktop

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Into `release/release-<triple>/`, the layout the manifest builder reads.
      - name: Download every platform from the CDN
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          staged="$RUNNER_TEMP/cdn"
          aws s3 sync "s3://$BUCKET/releases/$version/" "$staged" \
            --endpoint-url "$ENDPOINT" \
            --only-show-errors
          mkdir -p "$GITHUB_WORKSPACE/release"
          for directory in "$staged"/*/; do
            mv "$directory" "$GITHUB_WORKSPACE/release/release-$(basename "$directory")"
          done
          ls -R "$GITHUB_WORKSPACE/release"

      # What a user reads about a release has to be about *this* release. A
      # notes file left at the previous version is worse than none: it is
      # confidently wrong, and nothing downstream can tell.
      #
      # This replaced the commit message, which is what the notes used to be —
      # five paragraphs of engineering rationale, written for whoever maintains
      # this, shown to whoever installed it.
      - name: Require notes for the version being released
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          heading=$(head -1 RELEASE_NOTES.md | sed 's/^#* *//')
          echo "RELEASE_NOTES.md opens with: $heading"
          if [ "$heading" != "$version" ]; then
            echo "RELEASE_NOTES.md is for \"$heading\" and this release is $version." >&2
            exit 1
          fi

      - name: Build the manifest
        id: manifest
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/build-update-manifest.mjs \
            --version "$version" \
            --notes-file RELEASE_NOTES.md \
            --from "$GITHUB_WORKSPACE/release" \
            --base "https://cdn.uncached.app/releases/$version" \
            --out "$GITHUB_WORKSPACE/release/latest.json"
          cat "$GITHUB_WORKSPACE/release/latest.json"

      # R2 is spoken to over its S3 API, here and in the build: wrangler's
      # `r2 object put` wants account-level R2 permission, and this bucket's
      # token is scoped to its objects (403 / code 10000 otherwise).
      - name: Upload the manifest
        if: github.event_name == 'push' || !inputs.dry_run
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Five minutes, not a year. This is the one object whose whole job is
          # to change, and an immutable cache on it would mean a release nobody
          # is told about until the edge forgets.
          aws s3 cp "$GITHUB_WORKSPACE/release/latest.json" "s3://$BUCKET/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300" \
            --only-show-errors

      - name: Say that the version was not announced
        if: github.event_name != 'push' && inputs.dry_run
        run: echo "::notice::Dry run — the bundles are on the CDN and the manifest above was validated, but latest.json was not replaced."

      # Installers only. The updater bundles are not here on purpose: both macOS
      # builds emit a file called `Uncached.app.tar.gz`, and a GitHub release is
      # one flat list of assets — so attaching them collided, one overwrote the
      # other, and the upload failed on the metadata update. The CDN keeps them
      # apart under each target triple, and the updater reads them from there.
      #
      # What belongs on this page is what a person clicks.
      - name: Attach the installers to the GitHub release
        if: github.event_name == 'push' || !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          # Named rather than inferred: a republish is dispatched from a branch,
          # and the ref it runs on is not the tag the release belongs to.
          tag_name: v${{ steps.manifest.outputs.version }}
          files: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.deb
            release/*/*.rpm
            release/*/*.AppImage
          draft: true
          generate_release_notes: true
